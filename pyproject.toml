[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "embedding-similarity-showcase"
authors = [
    {name = "Anastasios Stamoulak", email = "anastasios.stamoulak@example.com"},
]
description = "A project to showcase embedding similarity for different modalities: text, image, audio, document, and geospatial data."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sentence-transformers",
    "transformers",
    "torch",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "plotly",
    "Pillow",
    "geopandas",
    "shapely",
    "librosa",
    "jupyter",
    "notebook",
    "ipykernel",
    "pre-commit>=4.3.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "pytest",
    "mypy"
]

[project.urls]
Source = "https://github.com/stamtron/embedding-similarity"

[tool.flit.module]
name = "embedding_similarity"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
